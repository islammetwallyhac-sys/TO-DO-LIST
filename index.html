<style>
  :root{
    --ink:#1C2321;
    --paper:#F2F0E9;
    --paper-2:#E9E5D9;
    --moss:#4F6F64;
    --moss-light:#E4EAE6;
    --clay:#B5652A;
    --clay-light:#F5E6DA;
    --stone:#8B8578;
    --stone-light:#DAD5C7;
    --white:#FFFFFF;
    --radius:10px;
    --serif:'Fraunces', serif;
    --sans:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif;
  }
  [data-theme="dark"]{
    --ink:#F2F0E9;
    --paper:#181D1B;
    --paper-2:#212824;
    --moss:#8FB3A4;
    --moss-light:#26332C;
    --clay:#E08A4F;
    --clay-light:#3A2A1E;
    --stone:#9A9border;
    --stone:#8f8b7e;
    --stone-light:#333831;
    --white:#20261F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  html[dir="rtl"] body{font-family:'IBM Plex Sans Arabic', var(--sans);}
  h1,h2,h3,.serif{font-family:var(--serif);}
  button{font-family:var(--sans); cursor:pointer;}
  input,textarea,select{font-family:var(--sans);}

  .app{display:flex; min-height:100vh;}

  /* ---- Sidebar ---- */
  .rail{
    width:220px; flex-shrink:0;
    background:var(--paper-2);
    border-right:1px solid var(--stone-light);
    display:flex; flex-direction:column;
    padding:24px 14px;
  }
  html[dir="rtl"] .rail{border-right:none; border-left:1px solid var(--stone-light);}
  .rail-brand{
    font-family:var(--serif); font-weight:600; font-size:22px;
    padding:0 10px 28px 10px; letter-spacing:0.2px;
  }
  .rail nav{display:flex; flex-direction:column; gap:2px; flex:1;}
  .rail button.nav-item{
    display:flex; align-items:center; gap:10px;
    background:none; border:none; text-align:start;
    padding:10px 12px; border-radius:8px;
    font-size:14.5px; color:var(--ink); opacity:0.72;
    transition:background .15s, opacity .15s;
  }
  .rail button.nav-item:hover{background:var(--stone-light); opacity:1;}
  .rail button.nav-item.active{background:var(--moss-light); color:var(--moss); opacity:1; font-weight:600;}
  .rail button.nav-item .ic{width:18px; height:18px; flex-shrink:0;}
  .rail-foot{font-size:12px; color:var(--stone); padding:10px;}

  /* ---- Main ---- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    display:flex; align-items:center; gap:16px;
    padding:20px 32px; border-bottom:1px solid var(--stone-light);
  }
  .topbar h1{font-size:24px; font-weight:600; flex-shrink:0;}
  .search-wrap{flex:1; max-width:420px; position:relative;}
  .search-wrap input{
    width:100%; padding:9px 14px; border-radius:8px;
    border:1px solid var(--stone-light); background:var(--white);
    font-size:13.5px; color:var(--ink);
  }
  .search-wrap input:focus{outline:2px solid var(--moss); outline-offset:1px;}
  .content{padding:28px 32px 60px 32px; flex:1;}

  .btn{
    padding:9px 16px; border-radius:8px; border:1px solid transparent;
    font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary{background:var(--moss); color:var(--white);}
  .btn-primary:hover{opacity:0.92;}
  .btn-ghost{background:transparent; border-color:var(--stone-light); color:var(--ink);}
  .btn-ghost:hover{background:var(--stone-light);}
  .btn-sm{padding:5px 10px; font-size:12.5px;}
  .btn-danger{background:transparent; color:var(--clay); border-color:var(--clay-light);}

  /* ---- Cards / lists ---- */
  .card{
    background:var(--white); border:1px solid var(--stone-light);
    border-radius:var(--radius); padding:16px 18px;
  }
  .section-title{font-size:15px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;}
  .grid-2{display:grid; grid-template-columns:1.4fr 1fr; gap:20px;}
  @media (max-width:900px){ .grid-2{grid-template-columns:1fr;} .rail{width:70px;} .rail-brand{font-size:0; padding:0 0 28px 0; text-align:center;} .rail-brand::before{content:'TF'; font-size:20px;} .nav-label{display:none;} .rail-foot{display:none;} }

  .stat-row{display:flex; gap:14px; margin-bottom:22px; flex-wrap:wrap;}
  .stat{
    flex:1; min-width:140px; background:var(--white); border:1px solid var(--stone-light);
    border-radius:var(--radius); padding:14px 16px;
  }
  .stat .num{font-family:var(--serif); font-size:30px; font-weight:600; line-height:1;}
  .stat .lbl{font-size:12.5px; color:var(--stone); margin-top:6px;}

  .task-row{
    display:flex; align-items:flex-start; gap:12px;
    padding:12px 4px; border-bottom:1px solid var(--stone-light);
  }
  .task-row:last-child{border-bottom:none;}
  .checkbox{
    width:19px; height:19px; border-radius:50%; border:1.5px solid var(--stone);
    flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center;
    background:var(--white);
  }
  .checkbox.done{background:var(--moss); border-color:var(--moss);}
  .checkbox.done::after{content:'✓'; color:#fff; font-size:11px;}
  .task-main{flex:1; min-width:0;}
  .task-title{font-size:14.5px; font-weight:500;}
  .task-title.done{text-decoration:line-through; opacity:0.5;}
  .task-meta{display:flex; gap:8px; margin-top:5px; flex-wrap:wrap; align-items:center;}
  .badge{font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600;}
  .badge-priority-high{background:var(--clay-light); color:var(--clay);}
  .badge-priority-medium{background:var(--moss-light); color:var(--moss);}
  .badge-priority-low{background:var(--stone-light); color:var(--stone);}
  .badge-overdue{background:var(--clay); color:#fff;}
  .badge-tag{background:var(--stone-light); color:var(--ink); opacity:0.8;}
  .progress-track{width:100%; height:5px; background:var(--stone-light); border-radius:4px; margin-top:8px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--moss); border-radius:4px;}
  .task-actions{display:flex; gap:4px; flex-shrink:0;}
  .icon-btn{background:none; border:none; padding:5px; border-radius:6px; color:var(--stone); font-size:14px;}
  .icon-btn:hover{background:var(--stone-light); color:var(--ink);}

  .empty{padding:32px 10px; text-align:center; color:var(--stone);}
  .empty .serif{font-size:17px; color:var(--ink); display:block; margin-bottom:4px;}

  /* Filters */
  .filter-row{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .chip{
    padding:6px 13px; border-radius:20px; border:1px solid var(--stone-light);
    font-size:12.5px; background:var(--white); color:var(--ink);
  }
  .chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(20,20,18,0.4);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--paper); border-radius:14px; width:100%; max-width:520px;
    max-height:88vh; overflow-y:auto; padding:26px; border:1px solid var(--stone-light);
  }
  .modal h2{font-size:19px; margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--stone); margin-bottom:5px;}
  .field input[type=text], .field input[type=date], .field input[type=time], .field textarea, .field select{
    width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--stone-light);
    background:var(--white); color:var(--ink); font-size:13.5px;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .row-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:20px;}
  .seg{display:flex; border:1px solid var(--stone-light); border-radius:8px; overflow:hidden;}
  .seg button{flex:1; padding:8px; background:var(--white); border:none; font-size:12.5px; color:var(--ink); border-inline-start:1px solid var(--stone-light);}
  .seg button:first-child{border-inline-start:none;}
  .seg button.active{background:var(--moss); color:#fff; font-weight:600;}
  input[type=range]{accent-color:var(--moss); width:100%;}

  /* Calendar */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{font-size:11.5px; color:var(--stone); text-align:center; padding-bottom:6px; font-weight:600;}
  .cal-cell{
    min-height:86px; border:1px solid var(--stone-light); border-radius:8px; padding:6px;
    background:var(--white); font-size:12px; cursor:pointer; display:flex; flex-direction:column; gap:3px;
  }
  .cal-cell.muted{opacity:0.35;}
  .cal-cell.today{border-color:var(--moss); border-width:1.5px;}
  .cal-daynum{font-weight:600; font-size:12.5px;}
  .cal-pill{background:var(--moss-light); color:var(--moss); border-radius:4px; padding:1px 5px; font-size:10.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cal-pill.overdue{background:var(--clay-light); color:var(--clay);}
  .cal-pill.event{background:var(--stone-light); color:var(--ink);}

  /* Notes grid */
  .notes-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;}
  .note-card{background:var(--white); border:1px solid var(--stone-light); border-radius:var(--radius); padding:14px; display:flex; flex-direction:column; gap:8px; min-height:130px;}
  .note-card .note-title{font-weight:600; font-size:14.5px; display:flex; justify-content:space-between; gap:6px;}
  .note-card .note-body{font-size:13px; color:var(--stone); flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical;}
  .pin-btn{background:none; border:none; font-size:14px; color:var(--stone);}
  .pin-btn.pinned{color:var(--clay);}

  /* Settings */
  .settings-group{margin-bottom:26px;}
  .settings-group h3{font-size:14px; margin-bottom:10px;}
  .opt-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--stone-light);}
  .opt-row:last-child{border-bottom:none;}
  .opt-row .opt-lbl{font-size:13.5px;}
  .opt-row .opt-desc{font-size:12px; color:var(--stone); margin-top:2px;}

  /* Analytics bars */
  .bar-chart{display:flex; align-items:flex-end; gap:10px; height:140px; margin-top:10px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;}
  .bar{width:100%; background:var(--moss); border-radius:4px 4px 0 0; min-height:2px;}
  .bar-lbl{font-size:10.5px; color:var(--stone);}

  ::-webkit-scrollbar{width:9px;} ::-webkit-scrollbar-thumb{background:var(--stone-light); border-radius:10px;}

  /* ---- Auth screen ---- */
  .auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .auth-card{width:100%; max-width:380px; background:var(--white); border:1px solid var(--stone-light); border-radius:14px; padding:32px 28px;}
  .auth-brand{font-family:var(--serif); font-size:24px; font-weight:600; margin-bottom:4px;}
  .auth-sub{font-size:13px; color:var(--stone); margin-bottom:24px;}
  .auth-tabs{display:flex; border:1px solid var(--stone-light); border-radius:8px; overflow:hidden; margin-bottom:20px;}
  .auth-tabs button{flex:1; padding:9px; background:var(--white); border:none; font-size:13px; color:var(--stone); border-inline-start:1px solid var(--stone-light);}
  .auth-tabs button:first-child{border-inline-start:none;}
  .auth-tabs button.active{background:var(--moss); color:#fff; font-weight:600;}
  .auth-error{background:var(--clay-light); color:var(--clay); font-size:12.5px; padding:9px 12px; border-radius:8px; margin-bottom:14px;}
  .auth-info{background:var(--moss-light); color:var(--moss); font-size:12.5px; padding:9px 12px; border-radius:8px; margin-bottom:14px;}
  .auth-submit{width:100%; justify-content:center; margin-top:6px;}
  .auth-link{background:none; border:none; color:var(--moss); font-size:12.5px; text-decoration:underline; padding:0; margin-top:14px; display:block; text-align:center; width:100%;}
  .auth-setup-note{margin-top:18px; font-size:11.5px; color:var(--stone); line-height:1.5; border-top:1px solid var(--stone-light); padding-top:14px;}
</style>

<!--
  ============================================================
  FIREBASE SETUP — REQUIRED FOR LOGIN TO WORK
  ============================================================
  1. Go to https://console.firebase.google.com → Create a project (free).
  2. In the project, go to Build → Authentication → Get started →
     enable the "Email/Password" sign-in provider.
  3. Go to Project settings (gear icon) → General → "Your apps" →
     click the </> (web) icon → register an app (no hosting needed).
  4. Firebase will show you a firebaseConfig object. Copy its values
     into the object below, replacing the placeholder strings.
  5. Save this file. Login/sign-up will then work for real.
  ============================================================
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    signOut as fbSignOut, onAuthStateChanged, sendPasswordResetEmail, updateProfile
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  // PASTE YOUR OWN FIREBASE PROJECT CONFIG HERE:
  const firebaseConfig = {
    apiKey: "AIzaSyACYp-k6RKAftDTk8_9NBp_WhJtGhAo_sc",
    authDomain: "to-do-list-e3047.firebaseapp.com",
    projectId: "to-do-list-e3047",
    storageBucket: "to-do-list-e3047.firebasestorage.app",
    messagingSenderId: "1094177775915",
    appId: "1:1094177775915:web:15f6d69a3992836313256e"
  };

  let auth = null;
  let configOk = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("YOUR_") !== 0;

  window.TaskFlowAuth = {
    configOk,
    currentUser: null,
    _ready: false,
    _listeners: [],
    onAuthChange(cb){ this._listeners.push(cb); if(this._ready) cb(this.currentUser); },
    async signUp(name, email, password){
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      if(name) await updateProfile(cred.user, {displayName: name});
      return cred.user;
    },
    async signIn(email, password){
      const cred = await signInWithEmailAndPassword(auth, email, password);
      return cred.user;
    },
    async signOutUser(){ await fbSignOut(auth); },
    async resetPassword(email){ await sendPasswordResetEmail(auth, email); }
  };

  if(configOk){
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    onAuthStateChanged(auth, (user)=>{
      window.TaskFlowAuth.currentUser = user;
      window.TaskFlowAuth._ready = true;
      window.TaskFlowAuth._listeners.forEach(cb=>cb(user));
    });
  } else {
    // No real Firebase config yet — signal "ready" with no user so the
    // app can show a setup notice instead of hanging on a blank screen.
    window.TaskFlowAuth._ready = true;
    setTimeout(()=> window.TaskFlowAuth._listeners.forEach(cb=>cb(null)), 0);
  }
</script>

      err_generic:"حدث خطأ ما. حاول مرة أخرى.",
      sign_out:"تسجيل الخروج", account:"الحساب",
    }
  };
  let lang = "en";
  const t = (k) => (STR[lang] && STR[lang][k]) || STR.en[k] || k;

  /* ---------------- State ---------------- */
  let state = {
    theme: "system",
    lang: "en",
    tasks: [],
    notes: [],
    events: [],
    categories: ["Work","Personal","Health"],
    view: "dashboard",
    search: ""
  };

  const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  const nowISO = () => new Date().toISOString();

  let currentUser = null; // {uid, email, displayName}
  let authView = 'login'; // 'login' | 'signup' | 'reset'
  let authError = null;
  let authInfo = null;
  let authBusy = false;

  function storeKeyFor(user){ return "taskflow-state-" + (user ? user.uid : "guest"); }

  function loadState(){
    const key = storeKeyFor(currentUser);
    try{
      const raw = localStorage.getItem(key);
      if(raw){
        const parsed = JSON.parse(raw);
        state = Object.assign({
          theme:"system", lang:"en", tasks:[], notes:[], events:[],
          categories:["Work","Personal","Health"], view:"dashboard", search:""
        }, parsed);
      } else {
        state = { theme:"system", lang:"en", tasks:[], notes:[], events:[],
          categories:["Work","Personal","Health"], view:"dashboard", search:"" };
      }
    }catch(e){ /* first run, no data yet */ }
    lang = state.lang || "en";
    applyThemeAndLang();
    render();
  }
  let saveTimer = null;
  function saveState(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      try{ localStorage.setItem(storeKeyFor(currentUser), JSON.stringify(state)); }catch(e){}
    }, 250);
  }

  function applyThemeAndLang(){
    let effectiveTheme = state.theme;
    if(effectiveTheme === "system"){
      effectiveTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', effectiveTheme);
    document.body.setAttribute('data-theme', effectiveTheme);
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  }

  /* ---------------- Date helpers ---------------- */
  function fmtDate(iso, opts){
    if(!iso) return "";
    const d = new Date(iso);
    return d.toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-US', opts || {month:'short', day:'numeric'});
  }
  function isSameDay(a,b){
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }
  function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
  function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }

  function taskIsOverdue(task){
    if(!task.dueAt) return false;
    if(task.status === 'completed' || task.status === 'cancelled') return false;
    return new Date(task.dueAt) < new Date();
  }
  function overdueLabel(task){
    const diffMs = new Date() - new Date(task.dueAt);
    const days = Math.floor(diffMs / 86400000);
    const hours = Math.floor((diffMs % 86400000)/3600000);
    if(days > 0) return `${t('overdue_by')} ${days}${t('days')}`;
    return `${t('overdue_by')} ${Math.max(hours,1)}${t('hours')}`;
  }

  /* Recurrence: compute next occurrence on/after today */
  function nextOccurrence(ev){
    if(!ev.date) return null;
    let d = new Date(ev.date);
    const today = startOfDay(new Date());
    if(ev.recurrence === 'none'){ return d; }
    const advance = (date)=>{
      const x = new Date(date);
      if(ev.recurrence === 'daily') x.setDate(x.getDate()+1);
      else if(ev.recurrence === 'weekly') x.setDate(x.getDate()+7);
      else if(ev.recurrence === 'monthly') x.setMonth(x.getMonth()+1);
      else if(ev.recurrence === 'yearly') x.setFullYear(x.getFullYear()+1);
      return x;
    };
    let guard = 0;
    while(startOfDay(d) < today && guard < 2000){ d = advance(d); guard++; }
    return d;
  }

  /* ---------------- Icons (inline SVG, stroke=currentColor) ---------------- */
  const ICON = {

    calendar:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    notes:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l5 5v13H6z"/><path d="M15 3v5h5"/></svg>',
    events:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',

    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
    edit:'✎', trash:'🗑', pin:'📌'
  };

  /* ---------------- Rendering ---------------- */
  const root = document.getElementById('app');
  let modal = null; // {type, data}

  function render(){
    applyThemeAndLang();
    if(!currentUser){
      root.innerHTML = renderAuthScreen();
      bindAuthEvents();
      return;
    }
    const navItems = [
      ['dashboard','nav_dashboard','dashboard'],
      ['tasks','nav_tasks','tasks'],
      ['calendar','nav_calendar','calendar'],
      ['notes','nav_notes','notes'],
      ['events','nav_events','events'],
      ['analytics','nav_analytics','analytics'],
      ['settings','nav_settings','settings'],
    ];
    const navHtml = navItems.map(([key,label,icon])=>`
      <button class="nav-item ${state.view===key?'active':''}" data-nav="${key}">
        ${ICON[icon]}<span class="nav-label">${t(label)}</span>
      </button>
    `).join('');

    root.innerHTML = `
      <div class="app">
        <aside class="rail">
          <div class="rail-brand">${t('brand')}</div>
          <nav>${navHtml}</nav>
          <div class="rail-foot">
            <div style="margin-bottom:8px; word-break:break-all;">${escapeHtml(currentUser.email||'')}</div>
            <button class="btn btn-ghost btn-sm" id="sign-out-btn" style="width:100%; justify-content:center;">${t('sign_out')}</button>
          </div>
        </aside>
        <div class="main">
          <div class="topbar">
            <h1>${t('nav_'+ (state.view))}</h1>

        </div>
      </div>
      <div id="modal-root"></div>
    `;

    document.querySelectorAll('[data-nav]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.view = btn.getAttribute('data-nav'); state.search=""; render(); });
    });
    const signOutBtn = document.getElementById('sign-out-btn');
    if(signOutBtn) signOutBtn.addEventListener('click', ()=>{ window.TaskFlowAuth.signOutUser().catch(()=>{}); });
    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', (e)=>{ state.search = e.target.value; renderView(); });

    renderView();

  function mapAuthError(err){
    const code = (err && err.code) || '';
    if(code.includes('email-already-in-use')) return t('err_email_in_use');
    if(code.includes('weak-password')) return t('err_weak_password');
    if(code.includes('invalid-email')) return t('err_invalid_email');
    if(code.includes('wrong-password')) return t('err_wrong_password');
    if(code.includes('user-not-found')) return t('err_user_not_found');
    if(code.includes('invalid-credential')) return t('err_wrong_password');
    return t('err_generic');
  }

  function renderAuthScreen(){
    if(!window.TaskFlowAuth || !window.TaskFlowAuth.configOk){
      return `
        <div class="auth-wrap">
          <div class="auth-card">
            <div class="auth-brand">${t('brand')}</div>
            <div class="auth-sub">${t('app_tagline')}</div>
            <div class="auth-error">${t('setup_required')}</div>
            <div class="auth-setup-note">${t('setup_required_desc')}</div>
          </div>
        </div>
      `;
    }
    const tabs = authView !== 'reset' ? `
      <div class="auth-tabs">
        <button data-auth-tab="login" class="${authView==='login'?'active':''}">${t('sign_in')}</button>
        <button data-auth-tab="signup" class="${authView==='signup'?'active':''}">${t('sign_up')}</button>
      </div>` : '';

    let fields = '';
    if(authView === 'signup'){
      fields = `
        <div class="field"><label>${t('full_name')}</label><input type="text" id="a-name"/></div>
        <div class="field"><label>${t('email')}</label><input type="text" id="a-email" autocomplete="email"/></div>
        <div class="field"><label>${t('password')}</label><input type="password" id="a-password" autocomplete="new-password"/></div>
        <button class="btn btn-primary auth-submit" id="a-submit" ${authBusy?'disabled':''}>${t('sign_up')}</button>
      `;
    } else if(authView === 'reset'){
      fields = `
        <div class="field"><label>${t('email')}</label><input type="text" id="a-email" autocomplete="email"/></div>
        <button class="btn btn-primary auth-submit" id="a-submit" ${authBusy?'disabled':''}>${t('send_reset_link')}</button>
        <button class="auth-link" id="a-back">${t('back_to_login')}</button>
      `;
    } else {
      fields = `
        <div class="field"><label>${t('email')}</label><input type="text" id="a-email" autocomplete="email"/></div>
        <div class="field"><label>${t('password')}</label><input type="password" id="a-password" autocomplete="current-password"/></div>
        <button class="btn btn-primary auth-submit" id="a-submit" ${authBusy?'disabled':''}>${t('sign_in')}</button>
        <button class="auth-link" id="a-forgot">${t('forgot_password')}</button>
      `;
    }

    return `
      <div class="auth-wrap">
        <div class="auth-card">
          <div class="auth-brand">${t('brand')}</div>
          <div class="auth-sub">${t('app_tagline')}</div>
          ${tabs}
          ${authError ? `<div class="auth-error">${escapeHtml(authError)}</div>` : ''}
          ${authInfo ? `<div class="auth-info">${escapeHtml(authInfo)}</div>` : ''}
          ${fields}
        </div>
      </div>
    `;
  }

  function bindAuthEvents(){
    document.querySelectorAll('[data-auth-tab]').forEach(b=>{
      b.addEventListener('click', ()=>{
        authView = b.getAttribute('data-auth-tab'); authError=null; authInfo=null; render();
      });
    });
    const forgotBtn = document.getElementById('a-forgot');
    if(forgotBtn) forgotBtn.addEventListener('click', ()=>{ authView='reset'; authError=null; authInfo=null; render(); });
    const backBtn = document.getElementById('a-back');
    if(backBtn) backBtn.addEventListener('click', ()=>{ authView='login'; authError=null; authInfo=null; render(); });

    const submitBtn = document.getElementById('a-submit');
    if(!submitBtn) return;
    submitBtn.addEventListener('click', async ()=>{
      authError = null; authInfo = null;
      const emailEl = document.getElementById('a-email');
      const email = emailEl ? emailEl.value.trim() : '';
      try{
        if(authView === 'signup'){
          const password = document.getElementById('a-password').value;
          const name = document.getElementById('a-name').value.trim();
          if(!email || !password){ authError = t('err_generic'); render(); return; }
          authBusy = true; render();
          await window.TaskFlowAuth.signUp(name, email, password);
        } else if(authView === 'reset'){
          if(!email){ authError = t('err_generic'); render(); return; }
          authBusy = true; render();
          await window.TaskFlowAuth.resetPassword(email);
          authBusy = false; authInfo = t('reset_sent'); authView='login'; render();
          return;
        } else {
          const password = document.getElementById('a-password').value;
          if(!email || !password){ authError = t('err_generic'); render(); return; }
          authBusy = true; render();
          await window.TaskFlowAuth.signIn(email, password);
        }
      }catch(err){
        authBusy = false;
        authError = mapAuthError(err);
        render();
      }
    });
  }

  function renderView(){
    const el = document.getElementById('view-root');
    if(!el) return;
    if(state.search && state.search.trim().length>0){
      el.innerHTML = renderSearchResults();
      bindSearchResultEvents();
      return;
    }
    switch(state.view){
      case 'dashboard': el.innerHTML = renderDashboard(); bindDashboardEvents(); break;
      case 'tasks': el.innerHTML = renderTasksView(); bindTasksEvents(); break;
      case 'calendar': el.innerHTML = renderCalendarView(); bindCalendarEvents(); break;
      case 'notes': el.innerHTML = renderNotesView(); bindNotesEvents(); break;
      case 'events': el.innerHTML = renderEventsView(); bindEventsEvents(); break;
      case 'analytics': el.innerHTML = renderAnalyticsView(); break;
      case 'settings': el.innerHTML = renderSettingsView(); bindSettingsEvents(); break;
    }
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  /* ---------- Dashboard ---------- */
  function renderDashboard(){
    const today = new Date();
    const activeTasks = state.tasks.filter(tk=>tk.status!=='cancelled');
    const todays = activeTasks.filter(tk=> tk.dueAt && isSameDay(new Date(tk.dueAt), today) && tk.status!=='completed');
    const upcoming = activeTasks.filter(tk=>{
      if(!tk.dueAt || tk.status==='completed') return false;
      const d = new Date(tk.dueAt);
      return d > startOfDay(addDays(today,0)) && d <= addDays(today,7) && !isSameDay(d,today);
    }).sort((a,b)=>new Date(a.dueAt)-new Date(b.dueAt));
    const overdue = activeTasks.filter(taskIsOverdue).sort((a,b)=>new Date(a.dueAt)-new Date(b.dueAt));
    const completedCount = state.tasks.filter(tk=>tk.status==='completed').length;
    const completionPct = state.tasks.length ? Math.round((completedCount/state.tasks.length)*100) : 0;

    return `
      <div class="field" style="max-width:480px; margin-bottom:24px;">
        <input id="quick-add" type="text" placeholder="${t('quick_add_ph')}" style="width:100%; padding:11px 14px; border-radius:9px; border:1px solid var(--stone-light); background:var(--white); font-size:14px;"/>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="num">${todays.length}</div><div class="lbl">${t('dash_today_tasks')}</div></div>
        <div class="stat"><div class="num">${upcoming.length}</div><div class="lbl">${t('dash_upcoming')}</div></div>
        <div class="stat"><div class="num" style="color:${overdue.length? 'var(--clay)':'inherit'}">${overdue.length}</div><div class="lbl">${t('dash_overdue')}</div></div>
        <div class="stat"><div class="num">${completionPct}%</div><div class="lbl">${t('completion')}</div></div>
      </div>
      <div class="grid-2">
        <div class="card">
          <div class="section-title">${t('today')}</div>
          ${todays.length ? todays.map(taskRowHtml).join('') : emptyHtml(t('no_tasks_today'), t('no_tasks_today_sub'))}
        </div>
        <div style="display:flex; flex-direction:column; gap:20px;">
          <div class="card">
            <div class="section-title">${t('upcoming')}</div>
            ${upcoming.length ? upcoming.slice(0,5).map(taskRowHtml).join('') : `<div class="empty">${t('no_upcoming')}</div>`}
          </div>
          <div class="card">
            <div class="section-title">${t('overdue')}</div>
            ${overdue.length ? overdue.slice(0,5).map(taskRowHtml).join('') : `<div class="empty">${t('no_overdue')}</div>`}
          </div>
        </div>
      </div>
    `;
  }
  function emptyHtml(title, sub){
    return `<div class="empty"><span class="serif">${title}</span>${sub}</div>`;
  }
  function bindDashboardEvents(){
    const qa = document.getElementById('quick-add');
    if(qa){
      qa.addEventListener('keydown', (e)=>{
        if(e.key==='Enter' && qa.value.trim()){
          addTask({title:qa.value.trim()});
          qa.value='';
          renderView();
        }
      });
    }
    bindTaskRowEvents();
  }

  function taskRowHtml(tk){
    const overdue = taskIsOverdue(tk);
    const done = tk.status === 'completed';
    const catTag = tk.categoryId ? `<span class="badge badge-tag">${escapeHtml(tk.categoryId)}</span>` : '';
    const tagsHtml = (tk.tags||[]).map(g=>`<span class="badge badge-tag">${escapeHtml(g)}</span>`).join('');
    return `
      <div class="task-row" data-task-id="${tk.id}">
        <button class="checkbox ${done?'done':''}" data-toggle="${tk.id}" aria-label="${done? t('mark_incomplete'): t('mark_complete')}"></button>
        <div class="task-main">
          <div class="task-title ${done?'done':''}">${escapeHtml(tk.title)}</div>
          <div class="task-meta">
            ${tk.priority ? `<span class="badge badge-priority-${tk.priority}">${t(tk.priority)}</span>` : ''}
            ${tk.dueAt ? `<span class="badge badge-tag">${fmtDate(tk.dueAt)}</span>` : ''}
            ${overdue ? `<span class="badge badge-overdue">${overdueLabel(tk)}</span>` : ''}
            ${catTag}${tagsHtml}
          </div>
          ${!done ? `<div class="progress-track"><div class="progress-fill" style="width:${tk.progress||0}%"></div></div>` : ''}
        </div>
        <div class="task-actions">
          <button class="icon-btn" data-edit="${tk.id}" title="${t('edit_task')}">${ICON.edit}</button>
          <button class="icon-btn" data-del="${tk.id}" title="${t('delete')}">${ICON.trash}</button>
        </div>
      </div>
    `;
  }
  function bindTaskRowEvents(){
    document.querySelectorAll('[data-toggle]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const id = b.getAttribute('data-toggle');
        const tk = state.tasks.find(x=>x.id===id);
        if(!tk) return;
        if(tk.status==='completed'){ tk.status='inProgress'; tk.progress = Math.min(tk.progress||0,99); tk.completedAt=null; }
        else { tk.status='completed'; tk.progress=100; tk.completedAt=nowISO(); }
        tk.updatedAt = nowISO();
        saveState(); renderView();
      });
    });
    document.querySelectorAll('[data-edit]').forEach(b=>{
      b.addEventListener('click', ()=>{ openTaskModal(b.getAttribute('data-edit')); });
    });
    document.querySelectorAll('[data-del]').forEach(b=>{
      b.addEventListener('click', ()=>{
        state.tasks = state.tasks.filter(x=>x.id!==b.getAttribute('data-del'));
        saveState(); renderView();
      });
    });

  function addTask(partial){
    const tk = Object.assign({
      id: uid(), userId:'local', title:'', description:'', status:'notStarted', progress:0,
      priority:'medium', categoryId:null, tags:[], dueAt:null, createdAt:nowISO(), updatedAt:nowISO(), completedAt:null
    }, partial);
    state.tasks.push(tk);
    saveState();
  }

  /* ---------- Tasks view ---------- */
  let taskFilter = 'all';
  function renderTasksView(){
    let list = state.tasks.slice().sort((a,b)=>{
      const ad = a.dueAt ? new Date(a.dueAt).getTime() : Infinity;
      const bd = b.dueAt ? new Date(b.dueAt).getTime() : Infinity;
      return ad-bd;
    });
    if(taskFilter==='active') list = list.filter(x=>x.status!=='completed' && x.status!=='cancelled');
    if(taskFilter==='overdue') list = list.filter(taskIsOverdue);
    if(taskFilter==='completed') list = list.filter(x=>x.status==='completed');

    const chips = ['all','active','overdue','completed'].map(f=>`
      <button class="chip ${taskFilter===f?'active':''}" data-filter="${f}">${t('filter_'+f)}</button>
    `).join('');

    return `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
        <div class="filter-row" style="margin-bottom:0;">${chips}</div>
        <button class="btn btn-primary" id="new-task-btn">${ICON.plus.replace('viewBox','width="14" height="14" viewBox')} ${t('new_task')}</button>
      </div>
      <div class="card">
        ${list.length ? list.map(taskRowHtml).join('') : `<div class="empty">${t('no_tasks_match')}</div>`}
      </div>
    `;
  }
  function bindTasksEvents(){
    document.querySelectorAll('[data-filter]').forEach(b=>{
      b.addEventListener('click', ()=>{ taskFilter = b.getAttribute('data-filter'); renderView(); });
    });
    const nb = document.getElementById('new-task-btn');
    if(nb) nb.addEventListener('click', ()=>openTaskModal(null));
    bindTaskRowEvents();
  }

  function openTaskModal(id){
    const tk = id ? state.tasks.find(x=>x.id===id) : null;
    modal = {type:'task', data: tk ? Object.assign({},tk) : {
      id:null, title:'', description:'', status:'notStarted', progress:0, priority:'medium',
      categoryId:'', tags:[], dueAt:''
    }};
    renderModal();
  }

  function renderModal(){
    const mr = document.getElementById('modal-root');
    if(!mr) return;
    if(!modal){ mr.innerHTML=''; return; }
    if(modal.type==='task') mr.innerHTML = taskModalHtml(modal.data);
    if(modal.type==='note') mr.innerHTML = noteModalHtml(modal.data);
    if(modal.type==='event') mr.innerHTML = eventModalHtml(modal.data);
    bindModalEvents();
  }

        saveState(); modal=null; render();
      });

    if(modal.type==='note'){
      const delBtn = document.getElementById('m-delete');
      if(delBtn) delBtn.addEventListener('click', ()=>{

      });

      saveBtn.addEventListener('click', ()=>{

        const tagsRaw = document.getElementById('m-tags').value;
        const payload = {

        if(modal.data.id){
          const n = state.notes.find(x=>x.id===modal.data.id);
          Object.assign(n, payload, {updatedAt:nowISO()});
        } else {
          state.notes.push(Object.assign({id:uid(), pinned:false, createdAt:nowISO(), updatedAt:nowISO()}, payload));
        }
        saveState(); modal=null; render();
      });

    if(modal.type==='event'){
      const delBtn = document.getElementById('m-delete');
      if(delBtn) delBtn.addEventListener('click', ()=>{
        state.events = state.events.filter(x=>x.id!==modal.data.id);

          recurrence: document.getElementById('m-recur').value
        };
        if(modal.data.id){
          const ev = state.events.find(x=>x.id===modal.data.id);
          Object.assign(ev, payload, {updatedAt:nowISO()});
        } else {
          state.events.push(Object.assign({id:uid(), createdAt:nowISO(), updatedAt:nowISO()}, payload));
        }
        saveState(); modal=null; render();
      });
    }
  }

  /* ---------- Calendar ---------- */
  let calCursor = new Date();
  function renderCalendarView(){
    const year = calCursor.getFullYear(), month = calCursor.getMonth();
    const first = new Date(year, month, 1);
    const startWeekday = first.getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const prevDaysInMonth = new Date(year, month, 0).getDate();
    const cells = [];
    for(let i=startWeekday-1;i>=0;i--) cells.push({day: prevDaysInMonth-i, muted:true, date:new Date(year, month-1, prevDaysInMonth-i)});
    for(let d=1; d<=daysInMonth; d++) cells.push({day:d, muted:false, date:new Date(year, month, d)});
    while(cells.length % 7 !== 0) {
      const nextIdx = cells.length - (startWeekday+daysInMonth);
      cells.push({day: nextIdx+1, muted:true, date:new Date(year, month+1, nextIdx+1)});
    }
    const monthLabel = calCursor.toLocaleDateString(lang==='ar'?'ar-EG':'en-US',{month:'long', year:'numeric'});
    const dowNames = lang==='ar'
      ? ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت']
      : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    const today = new Date();
    const cellsHtml = cells.map(c=>{
      const dayTasks = state.tasks.filter(tk=>tk.dueAt && isSameDay(new Date(tk.dueAt), c.date));
      const dayEvents = state.events.filter(ev=>{
        const occ = nextOccurrenceOnDay(ev, c.date);
        return occ;
      });
      const pills = [];
      dayTasks.slice(0,2).forEach(tk=>{
        pills.push(`<div class="cal-pill ${taskIsOverdue(tk)?'overdue':''}">${escapeHtml(tk.title)}</div>`);
      });
      dayEvents.slice(0,1).forEach(ev=>{
        pills.push(`<div class="cal-pill event">${escapeHtml(ev.title)}</div>`);
      });
      const more = (dayTasks.length+dayEvents.length) - pills.length;
      return `
        <div class="cal-cell ${c.muted?'muted':''} ${isSameDay(c.date,today)?'today':''}" data-date="${c.date.toISOString()}">
          <div class="cal-daynum">${c.day}</div>
          ${pills.join('')}
          ${more>0 ? `<div class="cal-pill">+${more}</div>` : ''}
        </div>
      `;
    }).join('');

    return `
      <div class="cal-head">
        <button class="btn btn-ghost btn-sm" id="cal-prev">‹</button>
        <div class="serif" style="font-size:18px; font-weight:600;">${monthLabel}</div>
        <button class="btn btn-ghost btn-sm" id="cal-next">›</button>
      </div>
      <div class="cal-grid">
        ${dowNames.map(n=>`<div class="cal-dow">${n}</div>`).join('')}
        ${cellsHtml}
      </div>
    `;
  }
  function nextOccurrenceOnDay(ev, day){
    if(!ev.date) return false;
    const base = new Date(ev.date);
    if(ev.recurrence === 'none' || !ev.recurrence) return isSameDay(base, day);
    if(day < startOfDay(base)) return false;
    if(ev.recurrence==='daily') return true;
    if(ev.recurrence==='weekly') return base.getDay()===day.getDay();
    if(ev.recurrence==='monthly') return base.getDate()===day.getDate();
    if(ev.recurrence==='yearly') return base.getDate()===day.getDate() && base.getMonth()===day.getMonth();
    return false;
  }
  function bindCalendarEvents(){
    document.getElementById('cal-prev').addEventListener('click', ()=>{ calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth()-1, 1); renderView(); });
    document.getElementById('cal-next').addEventListener('click', ()=>{ calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth()+1, 1); renderView(); });
    document.querySelectorAll('[data-date]').forEach(cell=>{
      cell.addEventListener('click', ()=>{

        setTimeout(()=>{ const due = document.getElementById('m-due'); if(due) due.value = dateStr; }, 0);
      });
    });
  }

  /* ---------- Analytics ---------- */
  function renderAnalyticsView(){
    const total = state.tasks.length;
    const completed = state.tasks.filter(x=>x.status==='completed').length;
    const overdueCount = state.tasks.filter(taskIsOverdue).length;
    const completionRate = total ? Math.round((completed/total)*100) : 0;
    const overdueRate = total ? Math.round((overdueCount/total)*100) : 0;
    const avgProgress = total ? Math.round(state.tasks.reduce((s,x)=>s+(x.progress||0),0)/total) : 0;

    const days = [];
    for(let i=6;i>=0;i--) days.push(addDays(startOfDay(new Date()), -i));
    const counts = days.map(d=> state.tasks.filter(x=>x.completedAt && isSameDay(new Date(x.completedAt), d)).length);
    const max = Math.max(1, ...counts);

    return `
      <div class="stat-row">
        <div class="stat"><div class="num">${completionRate}%</div><div class="lbl">${t('completion_rate')}</div></div>
        <div class="stat"><div class="num" style="color:${overdueRate>0?'var(--clay)':'inherit'}">${overdueRate}%</div><div class="lbl">${t('overdue_rate')}</div></div>
        <div class="stat"><div class="num">${completed}</div><div class="lbl">${t('tasks_completed')}</div></div>
        <div class="stat"><div class="num">${avgProgress}%</div><div class="lbl">${t('avg_progress')}</div></div>
      </div>
      <div class="card">
        <div class="section-title">${t('completed_last_7')}</div>
        <div class="bar-chart">
          ${days.map((d,i)=>`
            <div class="bar-col">
              <div class="bar" style="height:${(counts[i]/max*100)}%"></div>
              <div class="bar-lbl">${fmtDate(d.toISOString(),{weekday:'short'})}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;

        <div class="card">
          <div class="opt-row">
            <div><div class="opt-lbl">${t('theme')}</div><div class="opt-desc">${t('theme_desc')}</div></div>
            <div class="seg" style="width:220px;">
              ${['light','dark','system'].map(th=>`<button data-theme-opt="${th}" class="${state.theme===th?'active':''}">${t(th)}</button>`).join('')}
            </div>
          </div>
          <div class="opt-row">
            <div><div class="opt-lbl">${t('language')}</div><div class="opt-desc">${t('language_desc')}</div></div>
            <div class="seg" style="width:160px;">
              ${['en','ar'].map(l=>`<button data-lang-opt="${l}" class="${lang===l?'active':''}">${l==='en'?'English':'العربية'}</button>`).join('')}
            </div>
          </div>
        </div>
      </div>
      <div class="settings-group">
        <h3>${t('data')}</h3>
        <div class="card">
          <div class="opt-row">
            <div><div class="opt-lbl">${t('reset_data')}</div><div class="opt-desc">${t('reset_desc')}</div></div>
            <button class="btn btn-danger btn-sm" id="reset-btn">${t('reset_data')}</button>
          </div>
        </div>
      </div>
    `;
  }
  function bindSettingsEvents(){
    const settingsSignOut = document.getElementById('settings-sign-out');
    if(settingsSignOut) settingsSignOut.addEventListener('click', ()=>{ window.TaskFlowAuth.signOutUser().catch(()=>{}); });
    document.querySelectorAll('[data-theme-opt]').forEach(b=>{
      b.addEventListener('click', ()=>{ state.theme = b.getAttribute('data-theme-opt'); saveState(); render(); });
    });
    document.querySelectorAll('[data-lang-opt]').forEach(b=>{
      b.addEventListener('click', ()=>{ lang = b.getAttribute('data-lang-opt'); state.lang = lang; saveState(); render(); });
    });
    document.getElementById('reset-btn').addEventListener('click', ()=>{
      if(confirm(t('reset_confirm'))){
        state.tasks = []; state.notes = []; state.events = [];
        saveState(); render();
      }
    });
  }

  /* ---------- Search ---------- */
  function renderSearchResults(){
    const q = state.search.trim().toLowerCase();
    const tasks = state.tasks.filter(x=>x.title.toLowerCase().includes(q) || (x.description||'').toLowerCase().includes(q));
    const notes = state.notes.filter(x=>x.title.toLowerCase().includes(q) || (x.body||'').toLowerCase().includes(q));
    const events = state.events.filter(x=>x.title.toLowerCase().includes(q));
    const total = tasks.length+notes.length+events.length;
    if(total===0) return `<div class="empty">${t('no_results')}</div>`;
    return `
      ${tasks.length ? `<div class="card" style="margin-bottom:16px;"><div class="section-title">${t('nav_tasks')}</div>${tasks.map(taskRowHtml).join('')}</div>` : ''}
      ${notes.length ? `<div class="notes-grid" style="margin-bottom:16px;">${notes.map(noteCardHtml).join('')}</div>` : ''}
      ${events.length ? `<div class="card">${events.map(eventRowHtml).join('')}</div>` : ''}
    `;
  }
  function bindSearchResultEvents(){
    bindTaskRowEvents();
    document.querySelectorAll('[data-pin]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const n = state.notes.find(x=>x.id===b.getAttribute('data-pin'));
        n.pinned = !n.pinned; saveState(); renderView();
      });
    });
    document.querySelectorAll('[data-edit-note]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const n = state.notes.find(x=>x.id===b.getAttribute('data-edit-note'));
        modal = {type:'note', data:Object.assign({},n)}; renderModal();
      });
    });
    document.querySelectorAll('[data-del-note]').forEach(b=>{
      b.addEventListener('click', ()=>{
        state.notes = state.notes.filter(x=>x.id!==b.getAttribute('data-del-note'));
        saveState(); renderView();
      });
    });
    document.querySelectorAll('[data-edit-event]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const ev = state.events.find(x=>x.id===b.getAttribute('data-edit-event'));
        modal = {type:'event', data:Object.assign({},ev)}; renderModal();
      });
    });
    document.querySelectorAll('[data-del-event]').forEach(b=>{
      b.addEventListener('click', ()=>{
        state.events = state.events.filter(x=>x.id!==b.getAttribute('data-del-event'));
        saveState(); renderView();
      });
    });
  }

  /* ---------------- Init ---------------- */
  function waitForAuth(){
    if(window.TaskFlowAuth){
      window.TaskFlowAuth.onAuthChange((user)=>{
        currentUser = user ? { uid:user.uid, email:user.email, displayName:user.displayName } : null;
        authBusy = false; authError = null;
        if(currentUser){ loadState(); } else { render(); }
      });
    } else {
      setTimeout(waitForAuth, 30);
    }
  }
  waitForAuth();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
